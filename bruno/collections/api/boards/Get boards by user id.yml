info:
  name: Get boards by user id
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/boards?userId={{USER_ID}}"
  params:
    - name: userId
      value: "{{USER_ID}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
